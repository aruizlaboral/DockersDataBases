version: '3.8'

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2017-CU1-ubuntu
    # image: mcr.microsoft.com/mssql/server:2019-latest
    # image: mcr.microsoft.com/mssql/server:2022-preview-ubuntu-22.04

    container_name: server-sql-2017
    hostname: host-serversql
    environment:
      - ACCEPT_EULA=Y
    #  - MSSQL_SA_PASSWORD=mypasssword
    env_file:
      - .env
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - ../shared-folder:/shared
      - sql-data:/var/opt/mssql
      - ../sql/cargadatos:/docker-entrypoint-initdb.d/cargadatos.sql
    networks:
      - myred
    restart: always

# SERVER NODEJS
  node-server:
    build: 
      context: ./..  # Cambiamos el contexto para incluir el nivel superior
      dockerfile: ./docker-file/Dockerfile # ./directorio_donde_esta_el_Dockerfile/Dockerfile
    container_name: node-server-host
    restart: unless-stopped
    ports:
      - 5000:5000
    links:
    - "mongo-server"
    networks:
    - my_network

networks:
  myred:
    driver: bridge

volumes:
  sql-data:
    driver: local
