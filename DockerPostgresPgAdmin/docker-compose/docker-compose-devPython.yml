# Use postgres/example user/password credentials
version: '3.1'
services:

  postgres:
    image: postgres:13
    container_name: postgres
    env_file:
      - .env
    environment:  
      POSTGRES_DB: DBdev

    ports:
      - "5432:5432"  # Exponer el puerto de PostgreSQL para acceso desde la PC local
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistencia de datos de Postgres
      - ./mis_archivos:/docker_compartido        # Volumen compartido entre el host y el contenedor
      - ../sql/create_schema.sql:/docker-entrypoint-initdb.d/create_schema.sql
      - ../sql/data.sql:/docker-entrypoint-initdb.d/data.sql
    restart: unless-stopped
    #shm_size: 512mb                 # set shared memory limit when using docker-compose

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com    # Usuario de pgAdmin
      PGADMIN_DEFAULT_PASSWORD: admin           # Contraseña de pgAdmin
    ports:
      - "8080:8081"  # Exponer pgAdmin en el puerto 8080 de tu máquina local
    volumes:
      - pgadmin_data:/var/lib/pgadmin           # Persistencia de configuración de pgAdmin
    restart: unless-stopped
    depends_on:
      - postgres   # Asegurar que PostgreSQL se inicie antes de pgAdmin

  web-python:
    build:
      context: ..  # Cambiamos el contexto para incluir el nivel superior
      dockerfile: docker-file/Dockerfile  # Especificamos la ubicación del Dockerfile claramente
    ports:
      - "80:8082"  # Mapeo de puertos de la máquina anfitriona al contenedor
    depends_on:
      postgres:
        condition: service_healthy  # Espera a que el servicio de PostgreSQL esté saludable antes de iniciar
    command: ["python", "app.py"]  # Comando para ejecutar la aplicación Python
 
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
    
##Networks
networks:
  myred:
    driver: bridge