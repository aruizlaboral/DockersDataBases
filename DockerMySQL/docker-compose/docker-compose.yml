# Use root/example as user/password credentials
version: '3.9'
services:
##server mysql
  server-mysql:
    image: mysql
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: adderlin
    volumes:
      - .:/home
      - mysql-data:/var/lib/mysql
      # mongo-data:/data/db
      # postgres:/var/lib/postgresql/data

##Adminer web 
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    links:
      - "server-mysql"

##Volumes
volumes:
  mysql-data: